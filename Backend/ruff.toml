line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF012"]  # B008: FastAPI Depends() in defaults is idiomatic

[lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["E501"]
"scripts/seed.py" = ["E501"]  # seed data reads better on one line
